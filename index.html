const fmtCAD = (n) => `CA$${n.toFixed(2)}`;
const fmtPct = (n) => `${n > 0 ? "+" : ""}${n.toFixed(2)}%`;

// ──────────────────────────────────────────────────────────────────────────
// Responsive: detect narrow viewport (phones, small windows) and re-evaluate
// on resize. Single threshold at 640px — anything narrower gets the mobile
// layout. Same URL, same HTML; JS adapts the rendering.
// ──────────────────────────────────────────────────────────────────────────
function useIsMobile(breakpoint = 640) {
  const get = () =>
    typeof window !== "undefined" && window.innerWidth < breakpoint;
  const [isMobile, setIsMobile] = useState(get);
  useEffect(() => {
    if (typeof window === "undefined") return;
    const update = () => setIsMobile(window.innerWidth < breakpoint);
    window.addEventListener("resize", update);
    return () => window.removeEventListener("resize", update);
  }, [breakpoint]);
  return isMobile;
}

function interpolateAt(known, t) {
  if (known.length === 0) return 0;
  if (t <= known[0].t) return known[0].v;
  if (t >= known[known.length - 1].t) return known[known.length - 1].v;
  for (let i = 0; i < known.length - 1; i++) {
    if (t >= known[i].t && t <= known[i + 1].t) {
      const ratio = (t - known[i].t) / (known[i + 1].t - known[i].t);
      return known[i].v + (known[i + 1].v - known[i].v) * ratio;
    }
  }
  return known[known.length - 1].v;
}

// ──────────────────────────────────────────────────────────────────────────
// Build the merged data series and weekly spread bars from MDEF + MCYC arrays
// ──────────────────────────────────────────────────────────────────────────

function buildSeries(mdefArr, mcycArr, sp500Arr) {
  const knownMdef = mdefArr.map((r) => ({ t: Date.parse(r.date), v: r.nav }));
  const knownMcyc = mcycArr.map((r) => ({ t: Date.parse(r.date), v: r.nav }));
  const knownSp500 = (sp500Arr || []).map((r) => ({ t: Date.parse(r.date), v: r.nav }));
  const hasSp500 = knownSp500.length >= 2;

  const mdefIncept = knownMdef[0]?.v ?? 20;
  const mcycIncept = knownMcyc[0]?.v ?? 20;

  const dates = new Set();
  mdefArr.forEach((r) => dates.add(r.date));
  mcycArr.forEach((r) => dates.add(r.date));
  const sortedDates = [...dates].sort();

  const mdefSet = new Set(mdefArr.map((r) => r.date));
  const mcycSet = new Set(mcycArr.map((r) => r.date));

  const data = sortedDates.map((date) => {
    const t = Date.parse(date);
    const mdef = interpolateAt(knownMdef, t);
    const mcyc = interpolateAt(knownMcyc, t);
    const mdefObserved = mdefSet.has(date);
    const mcycObserved = mcycSet.has(date);
    const d = new Date(t);
    return {
      date,
      label: d.toLocaleDateString("en-US", { month: "short", day: "numeric" }),
      mdef: +mdef.toFixed(4),
      mcyc: +mcyc.toFixed(4),
      mdefReturn: +(((mdef - mdefIncept) / mdefIncept) * 100).toFixed(3),
      mcycReturn: +(((mcyc - mcycIncept) / mcycIncept) * 100).toFixed(3),
      spread: +(
        ((mcyc - mcycIncept) / mcycIncept - (mdef - mdefIncept) / mdefIncept) * 100
      ).toFixed(3),
      mdefObserved,
      mcycObserved,
      source: mdefObserved && mcycObserved
        ? "Observed (both)"
        : mdefObserved
        ? "Observed (MDEF)"
        : mcycObserved
        ? "Observed (MCYC)"
        : "Interpolated",
    };
  });

  const start = Math.min(
    knownMdef[0]?.t ?? Infinity,
    knownMcyc[0]?.t ?? Infinity
  );
  const end = Math.max(
    knownMdef[knownMdef.length - 1]?.t ?? -Infinity,
    knownMcyc[knownMcyc.length - 1]?.t ?? -Infinity
  );

  const weekMs = 7 * 24 * 60 * 60 * 1000;
  const weekly = [];
  let prevMdef = interpolateAt(knownMdef, start);
  let prevMcyc = interpolateAt(knownMcyc, start);
  let prevSp500 = hasSp500 ? interpolateAt(knownSp500, start) : null;
  let t = start + weekMs;
  let weekNum = 1;

  while (t <= end + weekMs / 2 && weekNum < 500) {
    const tCapped = Math.min(t, end);
    const mdef = interpolateAt(knownMdef, tCapped);
    const mcyc = interpolateAt(knownMcyc, tCapped);
    const mdefRet = prevMdef ? ((mdef - prevMdef) / prevMdef) * 100 : 0;
    const mcycRet = prevMcyc ? ((mcyc - prevMcyc) / prevMcyc) * 100 : 0;
    const d = new Date(tCapped);

    // S&P 500 weekly return — only computed when we have data covering this
    // week. Avoid extrapolating past the index data's actual range. Also
    // compute cumulative return from S&P inception value.
    let sp500Ret = null;
    let sp500CumRet = null;
    if (hasSp500) {
      const sp500Start = knownSp500[0].t;
      const sp500End = knownSp500[knownSp500.length - 1].t;
      const sp500Incept = knownSp500[0].v;
      if (tCapped >= sp500Start && tCapped <= sp500End && prevSp500 != null) {
        const sp500 = interpolateAt(knownSp500, tCapped);
        sp500Ret = +(((sp500 - prevSp500) / prevSp500) * 100).toFixed(3);
        sp500CumRet = +(((sp500 - sp500Incept) / sp500Incept) * 100).toFixed(3);
        prevSp500 = sp500;
      } else if (tCapped >= sp500Start) {
        prevSp500 = interpolateAt(knownSp500, tCapped);
        sp500CumRet = +(((prevSp500 - sp500Incept) / sp500Incept) * 100).toFixed(3);
      }
    }

    weekly.push({
      week: weekNum,
      date: d.toISOString().slice(0, 10),
      shortLabel: d.toLocaleDateString("en-US", { month: "short", day: "numeric" }),
      mdefRet: +mdefRet.toFixed(3),
      mcycRet: +mcycRet.toFixed(3),
      spread: +(mcycRet - mdefRet).toFixed(3),
      sp500Ret,
      sp500CumRet,
    });
    prevMdef = mdef;
    prevMcyc = mcyc;
    t += weekMs;
    weekNum++;
  }

  // ────────────────────────────────────────────────────────────────────────
  // Daily spread bars — built from real day-over-day NAV moves on dates
  // where BOTH ETFs have observed data. The Mackenzie XLSX exports give us
  // matching daily series, so this stays clean (no interpolation for the
  // bars themselves; the S&P 500 line can still be interpolated to fit).
  // ────────────────────────────────────────────────────────────────────────
  const dailyDates = [];
  const mdefByDate = new Map(mdefArr.map((r) => [r.date, r.nav]));
  const mcycByDate = new Map(mcycArr.map((r) => [r.date, r.nav]));
  for (const date of sortedDates) {
    if (mdefByDate.has(date) && mcycByDate.has(date)) dailyDates.push(date);
  }

  const daily = [];
  let prevDayMdef = null;
  let prevDayMcyc = null;
  let prevDaySp500 = null;
  const sp500Start = hasSp500 ? knownSp500[0].t : null;
  const sp500End = hasSp500 ? knownSp500[knownSp500.length - 1].t : null;

  for (const date of dailyDates) {
    const t = Date.parse(date);
    const mdef = mdefByDate.get(date);
    const mcyc = mcycByDate.get(date);

    if (prevDayMdef != null && prevDayMcyc != null) {
      const mdefRet = ((mdef - prevDayMdef) / prevDayMdef) * 100;
      const mcycRet = ((mcyc - prevDayMcyc) / prevDayMcyc) * 100;

      let sp500Ret = null;
      let sp500CumRet = null;
      if (hasSp500 && t >= sp500Start && t <= sp500End) {
        const sp500 = interpolateAt(knownSp500, t);
        const sp500Incept = knownSp500[0].v;
        sp500CumRet = +(((sp500 - sp500Incept) / sp500Incept) * 100).toFixed(3);
        if (prevDaySp500 != null) {
          sp500Ret = +(((sp500 - prevDaySp500) / prevDaySp500) * 100).toFixed(3);
        }
      }

      const d = new Date(t);
      daily.push({
        date,
        shortLabel: d.toLocaleDateString("en-US", { month: "short", day: "numeric" }),
        mdefRet: +mdefRet.toFixed(3),
        mcycRet: +mcycRet.toFixed(3),
        spread: +(mcycRet - mdefRet).toFixed(3),
        sp500Ret,
        sp500CumRet,
      });
    }

    prevDayMdef = mdef;
    prevDayMcyc = mcyc;
    if (hasSp500 && t >= sp500Start && t <= sp500End) {
      prevDaySp500 = interpolateAt(knownSp500, t);
    }
  }

  return { data, weekly, daily, hasSp500 };
}

function NavComparison() {
  const isMobile = useIsMobile();
  const [mode, setMode] = useState("nav");
  const [granularity, setGranularity] = useState("weekly"); // "daily" | "weekly"
  const [showSpread, setShowSpread] = useState(false);
  const [sp500Mode, setSp500Mode] = useState("cumulative"); // "off" | "periodic" | "cumulative"

  // Data is updated by the daily scheduled task that edits this file
  // directly — no in-app uploads or paste, so the arrays are constants.
  const mdefData = DEFAULT_MDEF;
  const mcycData = DEFAULT_MCYC;
  const sp500Data = DEFAULT_SP500;

  const { data, weekly, daily, hasSp500 } = useMemo(
    () => buildSeries(mdefData, mcycData, sp500Data),
    [mdefData, mcycData, sp500Data]
  );
  const latest = data[data.length - 1];

  // Source data for spread bar chart depends on granularity choice
  const barData = granularity === "daily" ? daily : weekly;

  const yDomain = useMemo(() => {
    if (mode === "nav") {
      const all = data.flatMap((d) => [d.mdef, d.mcyc]);
      return [
        Math.floor(Math.min(...all) * 2) / 2 - 0.5,
        Math.ceil(Math.max(...all) * 2) / 2 + 0.5,
      ];
    }
    if (mode === "weekly") {
      if (barData.length === 0) return [-1, 1];
      const spreadVals = barData.map((d) => Math.abs(d.spread));
      const sp500Vals =
        hasSp500 && sp500Mode === "periodic"
          ? barData.filter((d) => d.sp500Ret != null).map((d) => Math.abs(d.sp500Ret))
          : [];
      const max = Math.max(...spreadVals, ...sp500Vals, 0);
      const padded = max === 0 ? 1 : max * 1.15;
      return [-padded, padded];
    }
    const all = data.flatMap((d) => [d.mdefReturn, d.mcycReturn]);
    return [
      Math.floor(Math.min(...all) / 5) * 5 - 2,
      Math.ceil(Math.max(...all) / 5) * 5 + 2,
    ];
  }, [mode, data, barData, hasSp500, sp500Mode]);

  const xInterval = useMemo(() => {
    const n = data.length;
    if (n <= 8) return 0;
    if (n <= 20) return 1;
    // Fewer ticks on narrow viewports so labels don't collide
    return Math.floor(n / (isMobile ? 5 : 10));
  }, [data, isMobile]);

  const barXInterval = useMemo(() => {
    const n = barData.length;
    if (n <= 8) return 0;
    if (n <= 20) return 1;
    return Math.floor(n / (isMobile ? 6 : 12));
  }, [barData, isMobile]);

  // Right y-axis domain for the cumulative S&P 500 line, padded to start
  // visually at 0 (or below if the index drew down at any point).
  const sp500CumDomain = useMemo(() => {
    if (!hasSp500 || sp500Mode !== "cumulative") return [0, 1];
    const vals = barData.filter((d) => d.sp500CumRet != null).map((d) => d.sp500CumRet);
    if (vals.length === 0) return [0, 1];
    const min = Math.min(0, ...vals);
    const max = Math.max(0, ...vals);
    const pad = Math.max(1, (max - min) * 0.1);
    return [Math.floor((min - pad) / 2) * 2, Math.ceil((max + pad) / 2) * 2];
  }, [hasSp500, sp500Mode, barData]);

  return (
    <div
      style={{
        background: COLORS.bg,
        color: COLORS.text,

        }}

        <div>
          <div
            style={{
              fontFamily: "ui-monospace, 'SF Mono', Menlo, monospace",

              color: COLORS.muted,

              textTransform: "uppercase",

          >
            Toronto Stock Exchange — Mackenzie Tilt Series

          <h1
            style={{
              fontFamily: "ui-serif, Georgia, 'Times New Roman', serif",

              fontSize: isMobile ? 26 : 32,

                  strokeOpacity={0.55}
                  strokeDasharray="4 4"
                  label={{
                    value: "S&P 0%",
                    position: "insideRight",
                    fill: COLORS.sp500,
                    fillOpacity: 0.85,
                    fontSize: 9,
                    fontFamily: "ui-monospace, 'SF Mono', Menlo, monospace",
                    letterSpacing: "0.08em",
                    offset: 6,
                  }}
                />
              )}
              <Bar
                yAxisId="left"
                dataKey="spread"
                isAnimationActive={true}
                animationDuration={700}
              >
                {barData.map((d) => (
                  <Cell
                    key={d.date}
                    fill={d.spread >= 0 ? COLORS.mcyc : COLORS.mdef}
                    fillOpacity={
                      granularity === "daily"
                        ? Math.min(0.4 + Math.abs(d.spread) / 4, 1)
                        : Math.min(0.45 + Math.abs(d.spread) / 8, 1)
                    }
                  />
                ))}
              </Bar>
              {hasSp500 && sp500Mode !== "off" && (
                <Line
                  yAxisId={sp500Mode === "cumulative" ? "right" : "left"}
                  type="monotone"
                  dataKey={sp500Mode === "cumulative" ? "sp500CumRet" : "sp500Ret"}
                  stroke={COLORS.sp500}
                  strokeWidth={
                    sp500Mode === "cumulative" ? 2.5 : granularity === "daily" ? 1.5 : 2
                  }
                  dot={
                    sp500Mode === "cumulative" || granularity === "daily"
                      ? false
                      : { r: 2, fill: COLORS.sp500, stroke: "none" }
                  }
                  activeDot={{ r: 5, fill: COLORS.sp500, stroke: COLORS.bg, strokeWidth: 2 }}
                  connectNulls={sp500Mode === "cumulative"}
                  isAnimationActive={true}
                  animationDuration={600}
                  name="S&P 500 TR (CAD)"
                />
              )}
            </ComposedChart>
          ) : (
            <ComposedChart
              data={data}
              margin={{ top: 10, right: 20, left: 0, bottom: 10 }}
            >
              <CartesianGrid stroke={COLORS.border} strokeDasharray="0" vertical={false} />
              <XAxis
                dataKey="label"
                stroke={COLORS.muted}
                tick={{
                  fontFamily: "ui-monospace, 'SF Mono', Menlo, monospace",
                  fontSize: 10,
                  fill: COLORS.muted,
                }}
                interval={xInterval}
                tickLine={false}
                axisLine={{ stroke: COLORS.border }}
              />
              <YAxis
                domain={yDomain}
                stroke={COLORS.muted}
                tick={{
                  fontFamily: "ui-monospace, 'SF Mono', Menlo, monospace",
                  fontSize: 10,
                  fill: COLORS.muted,
                }}
                tickFormatter={(v) => (mode === "nav" ? `$${v.toFixed(1)}` : `${v}%`)}
                tickLine={false}
                axisLine={false}
                width={56}
              />
              <Tooltip
                content={<MainTooltip mode={mode} />}
                cursor={{ stroke: COLORS.muted, strokeDasharray: "2 4" }}
              />

              {mode === "return" && (
                <ReferenceLine y={0} stroke={COLORS.muted} strokeDasharray="3 3" />
              )}

              {showSpread && mode === "return" && (
                <Area
                  type="monotone"
                  dataKey="spread"
                  fill={COLORS.spread}
                  stroke="none"
                  fillOpacity={0.08}
                />
              )}

              <Line
                type="monotone"
                dataKey={mode === "nav" ? "mdef" : "mdefReturn"}
                stroke={COLORS.mdef}
                strokeWidth={2}
                dot={(props) => {
                  const { cx, cy, payload } = props;
                  const r = data.length > 30 ? 0 : payload.mdefObserved ? 4 : 2.5;
                  if (r === 0) return null;
                  return (
                    <circle
                      key={`mdef-${payload.date}`}
                      cx={cx}
                      cy={cy}
                      r={r}
                      fill={payload.mdefObserved ? COLORS.mdef : COLORS.bg}
                      stroke={COLORS.mdef}
                      strokeWidth={1.5}
                    />
                  );
                }}
                activeDot={{ r: 6, fill: COLORS.mdef, stroke: COLORS.bg, strokeWidth: 2 }}
                isAnimationActive={true}
                animationDuration={600}
                name="MDEF"
              />
              <Line
                type="monotone"
                dataKey={mode === "nav" ? "mcyc" : "mcycReturn"}
                stroke={COLORS.mcyc}
                strokeWidth={2}
                dot={(props) => {
                  const { cx, cy, payload } = props;
                  const r = data.length > 30 ? 0 : payload.mcycObserved ? 4 : 2.5;
                  if (r === 0) return null;
                  return (
                    <circle
                      key={`mcyc-${payload.date}`}
                      cx={cx}
                      cy={cy}
                      r={r}
                      fill={payload.mcycObserved ? COLORS.mcyc : COLORS.bg}
                      stroke={COLORS.mcyc}
                      strokeWidth={1.5}
                    />
                  );
                }}
                activeDot={{ r: 6, fill: COLORS.mcyc, stroke: COLORS.bg, strokeWidth: 2 }}
                isAnimationActive={true}
                animationDuration={600}
                animationBegin={150}
                name="MCYC"
              />
            </ComposedChart>
          )}
        </ResponsiveContainer>
      </div>

      {/* Legend strip */}
      <div
        style={{
          display: "flex",
          flexDirection: isMobile ? "column" : "row",
          justifyContent: "space-between",
          alignItems: isMobile ? "flex-start" : "center",
          gap: isMobile ? 6 : 0,
          marginTop: 14,
          fontFamily: "ui-monospace, 'SF Mono', Menlo, monospace",
          fontSize: isMobile ? 9 : 10,
          color: COLORS.muted,
          letterSpacing: "0.05em",
        }}
      >
        <div style={{ display: "flex", gap: 24, flexWrap: "wrap" }}>
          {mode === "weekly" ? (
            <>
              <span>
                <span
                  style={{
                    display: "inline-block",
                    width: 10,
                    height: 10,
                    background: COLORS.mcyc,
                    marginRight: 6,
                    verticalAlign: "middle",
                  }}
                />
                MCYC OUTPERFORMED
              </span>
              <span>
                <span
                  style={{
                    display: "inline-block",
                    width: 10,
                    height: 10,
                    background: COLORS.mdef,
                    marginRight: 6,
                    verticalAlign: "middle",
                  }}
                />
                MDEF OUTPERFORMED
              </span>
              <span>BAR OPACITY ∝ MAGNITUDE</span>
              {hasSp500 && sp500Mode !== "off" && (
                <span>
                  <span style={{ color: COLORS.sp500, marginRight: 6 }}>━━</span>
                  S&amp;P 500 TR (CAD) ·{" "}
                  {sp500Mode === "cumulative"
                    ? "CUMULATIVE RETURN (RIGHT AXIS)"
                    : granularity === "daily"
                    ? "DAILY RETURN"
                    : "1-WEEK RETURN"}
                </span>
              )}
            </>
          ) : (
            <>
              <span>
                <span style={{ color: COLORS.mdef, marginRight: 6 }}>━━</span>
                MDEF · DEFENSIVE TILT
              </span>
              <span>
                <span style={{ color: COLORS.mcyc, marginRight: 6 }}>━━</span>
                MCYC · CYCLICAL TILT
              </span>
              {data.length <= 30 && (
                <span>
                  <span
                    style={{
                      display: "inline-block",
                      width: 8,
                      height: 8,
                      borderRadius: "50%",
                      border: `1.5px solid ${COLORS.muted}`,
                      marginRight: 6,
                      verticalAlign: "middle",
                    }}
                  />
                  * Interpolated point
                </span>
              )}
            </>
          )}
        </div>
        <div style={{ fontStyle: "italic" }}>
          Sources: Mackenzie Investments · S&P Dow Jones Indices
        </div>
      </div>

      {/* Disclosure */}
      <div
        style={{
          marginTop: isMobile ? 16 : 20,
          padding: isMobile ? 12 : 16,
          border: `1px dashed ${COLORS.border}`,
          fontFamily: "ui-serif, Georgia, serif",
          fontSize: isMobile ? 11 : 12,
          fontStyle: "italic",
          color: COLORS.muted,
          lineHeight: 1.55,
        }}
      >
        <>
          Note on data — ETF NAVs from Mackenzie Investments' "Price History" export
          ({mdefData.length} MDEF and {mcycData.length} MCYC daily observations from inception
          on Sep 3, 2025; both funds launched at exactly CA$20.00). S&amp;P 500 CAD (TR) values
          from S&amp;P Dow Jones Indices ({sp500Data.length} daily index levels). Daily and
          weekly bars are computed from real day-over-day and week-over-week NAV moves on the
          observed series. The two ETF series refresh automatically each trading-day morning
          via a scheduled task that scrapes mackenzieinvestments.com.
        </>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(NavComparison));

</script>
</body>
</html>
